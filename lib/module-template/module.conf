# About this module. sitectl reads these lines; keep the key=value format.
#
# name         lowercase letters, digits and _ (and the folder's name
#              when installed)
# version      bump it for each release: installing a newer version
#              replaces the older one (which is kept in the backups)
# api          the sitectl module API it's written for (currently 1)
# requires_sitectl  the oldest sitectl version it works with
# depends      other modules it needs, separated by spaces (or nothing)
# enabled_by_default  yes: on as soon as it's installed; no: needs
#              `sitectl modules enable` (usual when it needs settings first)
name=__NAME__
version=1.0.0
description=Describe what __NAME__ does in one line
api=1
requires_sitectl=__SITECTL_VERSION__
depends=
enabled_by_default=no
